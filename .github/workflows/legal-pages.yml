name: Publish privacy and deletion pages

on:
  push:
    branches: [main]
    paths:
      - 'website/legal/**'
      - '.github/workflows/legal-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/legal
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
